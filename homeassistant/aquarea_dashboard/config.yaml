name: Aquarea Dashboard
version: "0.1.43"
slug: aquarea_dashboard
description: Panasonic Aquarea heat pump dashboard with history logging and optional heating control
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:heat-pump
panel_title: Aquarea
panel_admin: true
homeassistant_api: true
map:
  - type: app_config
    read_only: false
options:
  poll_minutes: 1
  allow_control: false
  debug: false
  ha_sensors: []
  heat_curve: "5:30,-7:34"
schema:
  poll_minutes: int(1,1440)
  allow_control: bool
  debug: bool
  ha_sensors:
    - match(^sensor\.[a-z0-9_]+$)
  heat_curve: str?
