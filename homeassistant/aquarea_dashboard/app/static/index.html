<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquarea Dashboard</title>
  <link rel="stylesheet" href="static/style.css">
  <script src="static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Aquarea Dashboard</h1>
    <div id="toolbar">
      <button id="btn-refresh" type="button">Refresh</button>
      <button id="btn-download" type="button">Download JSON</button>
    </div>
  </header>

  <main>
    <section id="app-view">
      <p id="status-line" class="muted"></p>
      <p id="app-error" class="error" hidden></p>
      <div id="devices"></div>
    </section>
  </main>
</body>
</html>
